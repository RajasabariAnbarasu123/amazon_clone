server:
  port: 8080

spring:
  application:
    name: amazon-clone

  datasource:
    url: jdbc:mysql://localhost:3306/amazon_clone?useSSL=false&serverTimezone=UTC
    username: root
    password: "Ramya@123&125"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    serialization:
      fail-on-empty-beans: false

jwt:
  secret: amazon_clone_secret_key
  expiration: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: DEBUG
